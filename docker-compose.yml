services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-artex}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in the .env file}
      POSTGRES_DB: ${POSTGRES_DB:-artex}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-artex} -d ${POSTGRES_DB:-artex}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  artex:
    # Locally built image (see the Dockerfile header for the build steps). ARTEX_IMAGE in .env can name another
    # image, such as one published by your own release workflow; only use an image from a source you control.
    image: ${ARTEX_IMAGE:-artex-global:local}
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ARTEX_PG_DSN: postgres://${POSTGRES_USER:-artex}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-artex}?sslmode=disable
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ARTEX_LLM_PROVIDER: ${ARTEX_LLM_PROVIDER:-}
      ARTEX_LLM_MODEL: ${ARTEX_LLM_MODEL:-}
      ARTEX_LLM_BASE_URL: ${ARTEX_LLM_BASE_URL:-}
      ARTEX_LLM_PROXY: ${ARTEX_LLM_PROXY:-}
      # First-run protection. If left empty, a random setup token is printed to the startup logs, and you must
      # enter it at /setup to create the admin password (check with docker compose logs artex).
      # If ARTEX_ADMIN_PASSWORD is set, it initializes with that value directly, skipping /setup (8+ characters).
      ARTEX_SETUP_TOKEN: ${ARTEX_SETUP_TOKEN:-}
      ARTEX_ADMIN_PASSWORD: ${ARTEX_ADMIN_PASSWORD:-}
      # Browser cross-origin allowlist (comma-separated). The built-in UI is same-origin, so this is usually empty.
      ARTEX_CORS_ORIGINS: ${ARTEX_CORS_ORIGINS:-}
      # GitHub repository (owner/name) one-click updates come from. No default: empty here and in Settings
      # means updates are unavailable.
      # Update checks stay off until turned on in Settings, and the Settings "Update source" field overrides this.
      ARTEX_UPDATE_REPO: ${ARTEX_UPDATE_REPO:-}
    ports:
      # By default it is published only on the host's 127.0.0.1. To connect directly from other devices, set
      # ARTEX_BIND=0.0.0.0 in .env, but first be sure to finish initial setup (admin password) and,
      # if possible, use the reverse proxy (HTTPS) setup from the README.
      - "${ARTEX_BIND:-127.0.0.1}:8787:8787"
      - "127.0.0.1:8788:8788"
    volumes:
      # Binds the data directory (jwt.key, SQLite, etc.) to data/ at the project root.
      # You can inspect and back it up directly on the host, and it survives recreating the container.
      - ./data:/app/data
      # Mounts the project root's skills into the container (overriding the /app/skills built into the image).
      # When you edit a skill, the container reads this host file directly without rebuilding the image.
      - ./skills:/app/skills
    restart: unless-stopped

volumes:
  pgdata:
