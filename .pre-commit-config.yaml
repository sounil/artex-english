# Example pre-commit configuration (official docs: https://pre-commit.com)
#
# Runs two of the repo CI's deterministic merge gates at local commit time first, so broken
# changes are caught before they are pushed. If any hook's assertion fails, it exits non-zero
# and the commit stops.
#
# 1) detections: only on commits that change the detection rules (detections/), the upstream
#    sources those rules pin, or the defense guide's inline Sigma templates (docs/defense-{ko,en}.md),
#    runs the runner that executes the eight detection tests and three gates at once
#    (detections/tests/run-all.sh). It passes the same rule/source scope as CI
#    (.github/workflows/detections.yml) first, catching changes that edit rules without updating
#    tests/layers, or that fix a defense template without updating that guide's claims. Requires
#    Docker (each test runs isolated in a container; nothing is installed on the runner).
# 2) docs: checks that in-repo links, images and anchor (#heading) references in tracked Markdown
#    docs point at existing targets (scripts/check-doc-links.py). It is the same check as CI
#    (.github/workflows/docs.yml), and to match that job running on every change without a paths
#    filter, it does not narrow the target files here either (always_run). Links break not only
#    when a .md is edited but also when the file a link pointed to (images, LICENSE, etc.) is deleted
#    or moved. Uses only the Python standard library and no network, so it finishes in tens of ms without Docker.
#
# Install:      pip install pre-commit && pre-commit install
# Run manually: pre-commit run detections --all-files
#               pre-commit run docs --all-files
#
# A minimal example wiring only two hooks. To add Go/web linting too, add your own hooks below.
repos:
  - repo: local
    hooks:
      - id: detections
        name: Detection rule tests, 8 kinds (Sigma, Suricata, ATT&CK, indicators, MISP)
        entry: detections/tests/run-all.sh
        language: script
        pass_filenames: false
        files: '^(detections/|enrich/enrich\.go|selfupdate/(github|stage)\.go|guard/guard\.go|db/db\.go|db/schema\.sql|cmd/artex/main\.go|traffic/traffic\.go|docs/defense-(ko|en)\.md)'
      - id: docs
        name: Docs internal link, image and anchor (#heading) integrity check
        entry: python3 -I scripts/check-doc-links.py
        language: system
        pass_filenames: false
        always_run: true
