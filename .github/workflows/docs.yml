name: docs
# On every push and PR, checks that in-repo links and image references in tracked Markdown docs
# point at existing files, and that document anchor links (#heading) point at headings that
# actually exist in the target document, so broken links, images and anchors cannot be merged.
# The files links point to can live anywhere in the repo (e.g. ../LICENSE, screenshots/en/*.png),
# so it runs on every change without a paths filter. External URLs (http/https/mailto) depend on
# the network and are flaky, so they are not checked: scripts/check-doc-links.py only looks at internal references.
# It uses only the Python standard library and never touches the network, so it finishes
# deterministically and does not flake on external factors like Docker Hub rate limits. Go build, static analysis and tests
# are handled by ci.yml, detection rule reproduction by detections.yml, and the web UI build by web.yml.
on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

# When a new push arrives on the same branch, cancel the earlier run so unnecessary runs do not pile up.
concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # python3 is preinstalled on the ubuntu-latest runner and the script uses only the standard
      # library, so no separate install step is needed. -I runs it isolated from the user site
      # and environment.
      - name: Docs internal link, image and anchor integrity check
        run: python3 -I scripts/check-doc-links.py
