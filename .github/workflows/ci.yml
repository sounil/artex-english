name: ci
# Runs build, static analysis and tests on every push and PR to catch regressions introduced
# during localization before merge. The release workflow (release.yml) runs only on tags (v*) and
# only builds and publishes, so this workflow is the one that verifies everyday changes.
on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  # Runs build, static analysis and tests without a database. This reproduces exactly the environment
  # of a contributor who clones the repo and runs `go test ./...` without PostgreSQL. Integration tests
  # that need a database are skipped with t.Skipf in this environment (skips count as passes), so the
  # build, go vet and every unit test that does not use the DB must be green. This combination alone
  # catches regressions that cross package boundaries (e.g. changing wording in one package breaks a
  # test assertion in another package) before merge.
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true
      - name: go build
        run: go build ./...
      - name: go vet
        run: go vet ./...
      - name: go test (no DB; integration tests skipped)
        run: go test ./... -count=1

  # Handles the DB integration tests that need a real PostgreSQL (notifications, evidence, usage metering, etc.).
  # It forces the paths the go job above skips (notification channel validation, evidence storage, llm_usage
  # metering, etc.) onto a real database, catching localization regressions that only show up on DB integration paths before merge.
  #
  # The upstream test harness is designed so that every package shares one database, creates tables only
  # once and reuses them, and implicitly depends on package execution order and accumulated data,
  # so running everything against a single database breaks in different ways (accumulated-data
  # pollution, connection teardown races, cross-package schema dependencies on reset). So here each
  # package gets its own PostgreSQL service and runs isolated as "empty database + single package". Each
  # package runs as an independent job (matrix) and never touches the others' data, connections or schema,
  # so those three conflicts disappear structurally. db.Open migrates the schema automatically, and tables
  # db.Open does not create, such as llm_usage, are ensured by each test itself via EnsureLLMUsageTable.
  go-db:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        pkg: [agent, config, db, evidence, llmrec, server]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: artex
          POSTGRES_PASSWORD: artex
          POSTGRES_DB: artex
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U artex -d artex"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true
      - name: go test (DB integration, ${{ matrix.pkg }} package isolated)
        env:
          ARTEX_PG_DSN: postgres://artex:artex@localhost:5432/artex?sslmode=disable
        run: go test ./${{ matrix.pkg }}/ -count=1
